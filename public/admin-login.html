<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><title>Admin login · ClearSky 5.0</title></head><body><main class="page"><header class="top"><a class="brand" href="/home.html"><span class="brand-mark">CS</span> ClearSky</a><span class="muted">Admin login</span></header><section class="auth"><div class="card"><h1>Admin</h1><p class="muted">Credentials are stored only in the backend.</p><form id="f"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button>Login</button></form><div id="m"><a href="/subadmin-login.html">Sub-admin login</a></div></div></section></main><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let r=await api("/api/login","POST",{email:email.value,password:password.value});if(r.verify){sessionStorage.cs_email=r.email;localStorage.cs_admin=1;location="/admin-otp.html"}else m.textContent=r.error||"Invalid admin login"}</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
