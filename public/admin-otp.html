<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Verification · ClearSky 5.0</title></head><body><main class="page"><header class="top"><a class="brand" href="/home.html"><span class="brand-mark">CS</span> ClearSky</a><span>Verification</span></header><div class="auth"><div class="card"><h1>Verification</h1><form id="f"><input id="code" maxlength="6" placeholder="Six-digit OTP"><button>Verify</button></form><div id="m"></div></div></div></main><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let r=await api('/api/otp','POST',{email:sessionStorage.cs_email,code:code.value});if(r.ok){sessionStorage.removeItem('cs_email');localStorage.cs_token=r.token;localStorage.removeItem('cs_admin');if(r.user.role==='admin')location='/admin.html';else if(r.user.role==='subadmin')location='/subadmin.html';else location='/home.html'}else m.textContent=r.error||'Verification failed'}</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
