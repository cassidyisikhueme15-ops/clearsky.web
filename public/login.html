<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><title>Login · ClearSky 5.0</title></head><body><main class="page"><header class="top"><a class="brand" href="/home.html"><span class="brand-mark">CS</span> ClearSky</a><span class="muted">Login</span></header><section class="auth"><div class="card"><div class="big-logo">CS</div><h1>Welcome back</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><div id="m"></div><a class="primary secondary" href="/signup.html">Create account</a><br><a href="/admin-login.html">Admin login</a></div></section><footer class="legal-links"><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms & Conditions</a></footer></main><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let r=await api("/api/login","POST",{email:email.value,password:password.value});if(r.verify){sessionStorage.cs_email=r.email;location="/otp.html"}else m.textContent=r.error||"Login failed"}</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
