<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Verify · ClearSky 5.0</title></head><body><main class="page"><div class="auth"><div class="card"><div class="brand"><span class="brand-mark">CS</span> ClearSky</div><h1>Verify your email</h1><p class="muted">Enter the six-digit code sent to your email. The verification code is kept only in temporary server memory and is not saved to the database.</p><form id="f"><input id="code" maxlength="6" inputmode="numeric" placeholder="000000"><button>Verify</button></form><button id="resend" class="secondary">Resend code</button><div id="m"></div></div></div></main><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let r=await api('/api/otp','POST',{email:sessionStorage.cs_email,code:code.value});if(r.ok){sessionStorage.removeItem('cs_email');localStorage.cs_token=r.token;localStorage.removeItem('cs_admin');if(r.user.role==='admin')location='/admin.html';else if(r.user.role==='subadmin')location='/subadmin.html';else location='/home.html'}else m.textContent=r.error};resend.onclick=async()=>{let r=await api('/api/resend-otp','POST',{email:sessionStorage.cs_email});m.textContent=r.ok?'New code sent.':r.error}</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
