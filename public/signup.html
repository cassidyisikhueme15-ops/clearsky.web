<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Sign up · ClearSky 5.0</title></head><body><main class="page"><header class="top"><a class="brand" href="/home.html"><span class="brand-mark">CS</span> ClearSky</a><span class="muted">Create account</span></header><section class="auth"><div class="card"><h1>Create your ClearSky account</h1><p class="muted">Choose a unique nickname. Your first membership purchase gets 5% off.</p><form id="f"><input id="email" type="email" placeholder="Email" required><input id="nickname" minlength="3" maxlength="24" placeholder="Unique nickname" required><div id="nickStatus" class="muted"></div><div id="suggestions" class="chips"></div><input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><label class="check"><input id="agree" type="checkbox" required> I agree to the <a href="/terms.html" target="_blank">Terms</a> and acknowledge the <a href="/privacy.html" target="_blank">Privacy Policy</a>.</label><button>Create account</button></form><div id="m"></div><a href="/login.html">Back to login</a></div></section></main><script src="/app.js"></script><script>
async function checkNick(){let n=nickname.value.trim();if(!n){nickStatus.textContent="";suggestions.innerHTML="";return}let r=await api("/api/nickname/check?nickname="+encodeURIComponent(n));nickStatus.textContent=r.available?"✓ Nickname is available":"That nickname is already taken.";nickStatus.className=r.available?"success":"error";suggestions.innerHTML=(r.suggestions||[]).map(x=>`<button type="button" class="chip" onclick="nickname.value='${esc(x)}';checkNick()">${esc(x)}</button>`).join("")}
nickname.addEventListener("input",checkNick);f.onsubmit=async e=>{e.preventDefault();let r=await api("/api/signup","POST",{email:email.value,password:password.value,nickname:nickname.value.trim()});if(r.ok){sessionStorage.cs_email=r.email;localStorage.cs_nickname=r.nickname;location="/otp.html"}else m.textContent=r.error+(r.suggestions?.length?" Try: "+r.suggestions.join(", "):"")};</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
