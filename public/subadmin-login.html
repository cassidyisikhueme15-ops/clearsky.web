<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Sub-admin login · ClearSky 5.0</title></head><body><main class="page"><header class="top"><a class="brand" href="/home.html"><span class="brand-mark">CS</span> ClearSky</a><span>Sub-admin login</span></header><div class="auth"><div class="card"><h1>Sub-admin login</h1><p class="muted">Paid applications must be approved by the owner after successful payment.</p><form id="f"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button>Continue</button></form><div id="m"></div></div></div></main><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let r=await api('/api/login','POST',{email:email.value,password:password.value});if(r.verify){sessionStorage.cs_email=r.email;localStorage.cs_subadmin=1;location='/admin-otp.html'}else m.textContent=r.error}</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
