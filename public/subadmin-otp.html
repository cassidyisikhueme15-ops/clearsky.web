<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Sub-admin OTP · ClearSky 5.0</title></head><body><main class="page"><section class="auth"><div class="card"><h1>Verify sub-admin</h1><form id="f"><input id="code" maxlength="6" placeholder="Six-digit OTP" required><button>Verify</button></form><div id="m"></div></div></section></main><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let r=await api("/api/subadmin/otp","POST",{email:sessionStorage.cs_sub_email,code:code.value});if(r.ok){localStorage.cs_token=r.token;location="/subadmin.html"}else m.textContent=r.error||"Invalid OTP"}</script><div id="navbar-container"></div><script src="/js/navbar.js"></script></body></html>
