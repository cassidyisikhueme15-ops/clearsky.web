<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25272a"><link rel="stylesheet" href="/style.css"><title>Tool · ClearSky 5.0</title></head>
<body><main class="page"><header class="top"><a class="brand" href="/tools.html"><span class="brand-mark">CS</span><span data-brand>ClearSky</span><span class="brand-version">5.0</span></a><span class="muted">Tool workspace</span></header><section id="workspace"></section></main><div id="navbar-container"></div><script src="/app.js"></script><script>
document.addEventListener("DOMContentLoaded",function(){
 const tool=new URLSearchParams(location.search).get("t")||"website";
 const names={website:"Website Maker",logo:"AI Logo Maker",flyer:"AI Flyer Maker",app:"App Builder",game:"Game Builder",photo:"Photo Studio",beats:"AI Beats Generator","ai-maker":"AI Maker"};
 const examples={website:"A modern website for a Lagos fashion brand with Home, About, Services and Contact.",logo:"A premium minimalist logo for a technology company called Nova Labs.",flyer:"A professional restaurant flyer for a weekend special.",app:"A business booking app with login, calendar and payment screens.",game:"A mobile adventure game with three levels and a simple reward system.",photo:"Edit or generate a photo with AI.",beats:"Hip-hop beat, dark piano mood, punchy kick, crisp snare, 96 BPM.","ai-maker":"Create an AI-powered business assistant that can answer customer questions, organize tasks and generate useful content."};
 const workspace=document.getElementById("workspace"); const name=names[tool]||"AI Tool";
 const hero=document.createElement("section");hero.className="hero";hero.innerHTML='<span class="pill">'+esc(name.toUpperCase())+'</span><h1>'+esc(name)+'</h1><p class="muted">'+esc(examples[tool]||"Describe what you want to generate.")+'</p>';workspace.appendChild(hero);
 if(tool==="photo"){renderPhoto(workspace);return;}
 const card=document.createElement("div");card.className="card";card.innerHTML='<textarea id="prompt" rows="8" placeholder="Describe exactly what you want..."></textarea><div class="row"><button id="generateButton">Generate</button><button id="imageButton" class="secondary">Generate image</button></div><div id="output" class="result"></div>';workspace.appendChild(card);
 const prompt=card.querySelector("#prompt"),gen=card.querySelector("#generateButton"),img=card.querySelector("#imageButton"),out=card.querySelector("#output");
 if(tool!=="logo"&&tool!=="flyer"&&tool!=="ai-maker")img.style.display="none";
 function gate(){if(isLoggedIn())return true;showLoginRequired(out,"Sign in or log in before generating with ClearSky.");return false;}
 gen.onclick=async function(){if(!gate())return;const text=prompt.value.trim();if(!text){out.textContent="Describe what you want first.";return;}gen.disabled=true;out.textContent="Generating…";try{const r=await api("/api/ai/text","POST",{tool:tool,prompt:text});if(r.loginRequired){showLoginRequired(out,"Your session is not active. Please log in again.");return;}out.textContent=r.result||r.error||"Generation failed.";if(r.watermark){const n=document.createElement("div");n.className="watermark-note";n.textContent="Created with ClearSky watermark.";out.appendChild(n);}}catch(e){out.textContent="Generation failed. Please try again."}finally{gen.disabled=false}};
 img.onclick=async function(){if(!gate())return;const text=prompt.value.trim();if(!text){out.textContent="Describe the image you want first.";return;}img.disabled=true;out.textContent="Generating image…";try{const r=await api("/api/ai/image","POST",{tool:tool,prompt:text});if(r.loginRequired){showLoginRequired(out,"Your session is not active. Please log in again.");return;}out.innerHTML="";if(r.image){const image=document.createElement("img");image.src=r.image;image.alt="Generated by ClearSky";image.style.maxWidth="100%";image.style.borderRadius="15px";out.appendChild(image)}else out.textContent=r.error||"Image generation failed."}catch(e){out.textContent="Image generation failed."}finally{img.disabled=false}};
});

function renderPhoto(workspace){
 const card=document.createElement("div");card.className="card";card.innerHTML='<div id="photoDrop" class="drop" tabindex="0"><b>Drag & drop a photo here</b><br><span>or tap to choose an image</span><input id="photoFile" type="file" accept="image/*" hidden></div><div id="photoPreview" style="display:none;margin:15px 0"></div><label>How should the photo be edited?<textarea id="photoPrompt" rows="5" placeholder="Example: Remove the background, make it look professional, improve the lighting and keep the person natural."></textarea></label><div class="row"><button id="editPhoto">Edit uploaded photo</button><button id="generatePhoto" class="secondary">Generate photo</button></div><div id="photoOutput" class="result"></div>';workspace.appendChild(card);
 const drop=card.querySelector("#photoDrop"),file=card.querySelector("#photoFile"),preview=card.querySelector("#photoPreview"),prompt=card.querySelector("#photoPrompt"),edit=card.querySelector("#editPhoto"),generate=card.querySelector("#generatePhoto"),out=card.querySelector("#photoOutput");let dataUrl="";
 function gate(){if(isLoggedIn())return true;showLoginRequired(out,"Sign in or log in before using the Photo Studio.");return false;}
 drop.onclick=function(){file.click()};drop.ondragover=function(e){e.preventDefault();drop.classList.add("dragover")};drop.ondragleave=function(){drop.classList.remove("dragover")};drop.ondrop=function(e){e.preventDefault();drop.classList.remove("dragover");if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};file.onchange=function(){if(file.files[0])loadFile(file.files[0])};
 function loadFile(f){if(!f.type.startsWith("image/")){out.textContent="Please choose an image file.";return;}const reader=new FileReader();reader.onload=function(){dataUrl=reader.result;preview.style.display="block";preview.innerHTML="<img src='"+dataUrl+"' alt='Selected photo' style='max-width:100%;max-height:420px;border-radius:16px;display:block;margin:auto'>";drop.querySelector("b").textContent="Photo selected"};reader.readAsDataURL(f);}
 edit.onclick=async function(){if(!gate())return;if(!dataUrl){out.textContent="Drag and drop a photo first.";return;}const text=prompt.value.trim();if(!text){out.textContent="Describe how you want the photo edited.";return;}edit.disabled=true;out.textContent="Editing photo…";try{const r=await api("/api/ai/photo-edit","POST",{image:dataUrl,prompt:text});out.innerHTML="";if(r.image){const image=document.createElement("img");image.src=r.image;image.alt="Edited by ClearSky";image.style.maxWidth="100%";image.style.borderRadius="15px";out.appendChild(image)}else out.textContent=r.error||"Photo editing failed."}catch(e){out.textContent="Photo editing failed."}finally{edit.disabled=false}};
 generate.onclick=async function(){if(!gate())return;const text=prompt.value.trim();if(!text){out.textContent="Describe the photo you want the AI to generate.";return;}generate.disabled=true;out.textContent="Generating photo…";try{const r=await api("/api/ai/image","POST",{tool:"photo",prompt:text});out.innerHTML="";if(r.image){const image=document.createElement("img");image.src=r.image;image.alt="Generated by ClearSky";image.style.maxWidth="100%";image.style.borderRadius="15px";out.appendChild(image)}else out.textContent=r.error||"Photo generation failed."}catch(e){out.textContent="Photo generation failed."}finally{generate.disabled=false}};
}
</script><script src="/js/navbar.js"></script></body></html>
